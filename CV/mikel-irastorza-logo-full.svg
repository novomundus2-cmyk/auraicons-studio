<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="Mikel Irastorza · Lead Systems Architect &amp; Big Data Engineer · EKC &amp; EFA">
  <defs>

    <!-- Warm Velvet Obsidian Void -->
    <radialGradient id="h_humBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1f1b16" />
      <stop offset="50%" stop-color="#0f0d0b" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Warm Amber Hearth Halo (Calor Humano) -->
    <radialGradient id="h_humHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#92400e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Champagne Specular Ribbon Light -->
    <linearGradient id="h_humChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Warm Hand-Etched Gold (Left Flow) -->
    <linearGradient id="h_humGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Hand-Chiseled Cognac Bronze (Right Shade) -->
    <linearGradient id="h_humGoldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#5a2307" />
    </linearGradient>

    <!-- Central Human Spire / Column of Trust -->
    <linearGradient id="h_humSpire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Artisan Bevel Wireframe Sheen -->
    <linearGradient id="h_humSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Depth Shadow with Warm Glow -->
    <filter id="h_humShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>

  </defs>

  <!-- Base Obsidian Plaque -->
  <rect width="1000" height="240" rx="28" fill="url(#h_humBg)" />
  <rect width="998" height="238" x="1" y="1" rx="27" fill="none" stroke="url(#h_humSheen)" stroke-width="1.6" stroke-opacity="0.38" />

  <!-- Ambient Light Behind Symbol -->
  <circle cx="120" cy="120" r="100" fill="url(#h_humHalo)" />

  <!-- CAD Background Grids -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.12" stroke-width="1">
    <circle cx="120" cy="120" r="88" stroke-dasharray="3 6" />
    <circle cx="120" cy="120" r="62" />
    <line x1="24" y1="120" x2="216" y2="120" />
    <line x1="120" y1="24" x2="120" y2="216" />
    <line x1="244" y1="32" x2="244" y2="208" stroke="#f59e0b" stroke-opacity="0.25" stroke-width="1.5" />
  </g>

  <!-- ================= EMBLEM ICON (Left) ================= -->
  <g transform="translate(120, 120) scale(0.36) translate(-256, -256)" filter="url(#h_humShadow)">

    <!-- Protective Seal Hexagon with Curved Fillets -->
    <path d="M 248,109 Q 256,104 264,109 L 382,176 Q 388,180 388,188 L 388,324 Q 388,332 382,336 L 264,403 Q 256,408 248,403 L 130,336 Q 124,332 124,324 L 124,188 Q 124,180 130,176 Z"
          fill="#0c0a09" fill-opacity="0.65"
          stroke="url(#h_humSheen)" stroke-width="2.8" stroke-linejoin="round" />

    <!-- Corner Gold Rivets / Human Anchor Points -->
    <circle cx="256" cy="106" r="3.5" fill="#ffffff" />
    <circle cx="385" cy="182" r="3.5" fill="#fef3c7" />
    <circle cx="385" cy="330" r="3.5" fill="#fef3c7" />
    <circle cx="256" cy="406" r="3.5" fill="#fef3c7" />
    <circle cx="127" cy="330" r="3.5" fill="#fef3c7" />
    <circle cx="127" cy="182" r="3.5" fill="#fef3c7" />

    <!-- ================= THE "M" SCULPTURE ================= -->
    <!-- Left Ascending Wing -->
    <path d="M 144,198 L 186,172 L 186,326 L 144,302 Z"
          fill="url(#h_humGoldLeft)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Peak Crest (Gentle Arched Curve) -->
    <path d="M 186,172 Q 206,158 224,148 L 224,198 Q 206,208 186,220 Z"
          fill="url(#h_humChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- Left Valley (Flowing down into the center) -->
    <path d="M 224,148 Q 240,174 256,198 L 256,246 Q 240,222 224,198 Z"
          fill="url(#h_humGoldLeft)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Valley (Ascending from center with matching curvature) -->
    <path d="M 256,198 Q 272,174 288,148 L 288,198 Q 272,222 256,246 Z"
          fill="url(#h_humGoldRight)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Peak Crest (Gentle Arched Curve) -->
    <path d="M 288,148 Q 306,158 326,172 L 326,220 Q 306,208 288,198 Z"
          fill="url(#h_humChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- Right Ascending Wing -->
    <path d="M 326,172 L 368,198 L 368,302 L 326,326 Z"
          fill="url(#h_humGoldRight)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Structural Flange Base -->
    <path d="M 186,220 L 224,198 L 224,346 L 186,326 Z"
          fill="url(#h_humGoldLeft)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Right Structural Flange Base -->
    <path d="M 288,198 L 326,220 L 326,326 L 288,346 Z"
          fill="url(#h_humGoldRight)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- ================= THE "I" COLUMN OF TRUST ================= -->
    <path d="M 248,132 L 256,124 L 256,364 L 248,358 Z"
          fill="url(#h_humSpire)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M 256,124 L 264,132 L 264,358 L 256,364 Z"
          fill="url(#h_humGoldRight)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Crown Diamond Jewel -->
    <polygon points="256,108 268,120 256,132 244,120"
             fill="#ffffff" stroke="url(#h_humSheen)" stroke-width="1.5" />
    <circle cx="256" cy="120" r="2.4" fill="#f59e0b" />

    <!-- Bottom Plumb Jewel -->
    <polygon points="256,358 266,368 256,378 246,368"
             fill="url(#h_humGoldLeft)" stroke="#ffffff" stroke-width="1" />

    <!-- Optical Core Warm Spark -->
    <circle cx="256" cy="198" r="4" fill="#ffffff" />
    <line x1="236" y1="198" x2="276" y2="198" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="256" y1="178" x2="256" y2="218" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />

  </g>

  <!-- ================= TYPOGRAPHY & IDENTITY (Right) ================= -->
  <g transform="translate(284, 0)">
    <text x="0" y="60" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="4">
      SISTEMAS DISTRIBUIDOS · DATA ENGINEERING · EFA
    </text>

    <text x="0" y="112" fill="url(#h_humChampagne)" font-family="'Cabinet Grotesk', 'Space Grotesk', -apple-system, sans-serif" font-size="44" font-weight="900" letter-spacing="1.5">
      MIKEL IRASTORZA
    </text>

    <text x="0" y="152" fill="#e7e5e4" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="17" font-weight="600" letter-spacing="0.8">
      Lead Systems Architect &amp; Big Data Engineer · Artesanía Digital
    </text>

    <!-- Tech Badges & Invariant Badges -->
    <g transform="translate(0, 172)">
      <rect x="0" y="0" width="134" height="26" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1" />
      <text x="67" y="17" text-anchor="middle" fill="#fef3c7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">EKC TRI-CORE</text>

      <rect x="144" y="0" width="170" height="26" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1" />
      <text x="229" y="17" text-anchor="middle" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">LUCA PACIOLI 0.00¢</text>

      <rect x="324" y="0" width="156" height="26" rx="6" fill="#f59e0b" fill-opacity="0.14" stroke="#f59e0b" stroke-opacity="0.45" stroke-width="1" />
      <text x="402" y="17" text-anchor="middle" fill="#fde68a" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CAD ±0.200mm</text>

      <rect x="490" y="0" width="154" height="26" rx="6" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-opacity="0.6" stroke-width="1" />
      <text x="567" y="17" text-anchor="middle" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="800">CRITERIO HUMANO</text>
    </g>
  </g>
</svg>
