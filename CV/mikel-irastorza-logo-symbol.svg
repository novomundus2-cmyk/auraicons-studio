<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mikel Irastorza · Artesanía Digital &amp; Criterio Humano · EKC &amp; EFA">
  <defs>

    <!-- Warm Velvet Obsidian Void -->
    <radialGradient id="humBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#1f1b16" />
      <stop offset="50%" stop-color="#0f0d0b" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Warm Amber Hearth Halo (Calor Humano) -->
    <radialGradient id="humHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#d97706" stop-opacity="0.18" />
      <stop offset="80%" stop-color="#92400e" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Champagne Specular Ribbon Light -->
    <linearGradient id="humChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Warm Hand-Etched Gold (Left Flow) -->
    <linearGradient id="humGoldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Hand-Chiseled Cognac Bronze (Right Shade) -->
    <linearGradient id="humGoldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#5a2307" />
    </linearGradient>

    <!-- Central Human Spire / Column of Trust -->
    <linearGradient id="humSpire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fffbeb" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Artisan Bevel Wireframe Sheen -->
    <linearGradient id="humSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Soft Depth Shadow with Warm Glow -->
    <filter id="humShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>

  </defs>

  <!-- Deep Obsidian Squircle Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#humBg)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="url(#humSheen)" stroke-width="1.8" stroke-opacity="0.4" />
  <rect width="498" height="498" x="7" y="7" rx="105" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.15" stroke-dasharray="3 6" />

  <!-- Warm Core Halo -->
  <circle cx="256" cy="256" r="215" fill="url(#humHalo)" />

  <!-- Craftsman Guilloche Lines -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.14" stroke-width="0.8">
    <path d="M 386.0,256.0 Q 372.7,372.7 424.9,353.5" />
    <path d="M 381.6,289.6 Q 338.5,398.9 393.9,393.9" />
    <path d="M 368.6,321.0 Q 298.7,415.4 353.5,424.9" />
    <path d="M 347.9,347.9 Q 256.0,421.0 306.5,444.4" />
    <path d="M 321.0,368.6 Q 213.3,415.4 256.0,451.0" />
    <path d="M 289.6,381.6 Q 173.5,398.9 205.5,444.4" />
    <path d="M 256.0,386.0 Q 139.3,372.7 158.5,424.9" />
    <path d="M 222.4,381.6 Q 113.1,338.5 118.1,393.9" />
    <path d="M 191.0,368.6 Q 96.6,298.7 87.1,353.5" />
    <path d="M 164.1,347.9 Q 91.0,256.0 67.6,306.5" />
    <path d="M 143.4,321.0 Q 96.6,213.3 61.0,256.0" />
    <path d="M 130.4,289.6 Q 113.1,173.5 67.6,205.5" />
    <path d="M 126.0,256.0 Q 139.3,139.3 87.1,158.5" />
    <path d="M 130.4,222.4 Q 173.5,113.1 118.1,118.1" />
    <path d="M 143.4,191.0 Q 213.3,96.6 158.5,87.1" />
    <path d="M 164.1,164.1 Q 256.0,91.0 205.5,67.6" />
    <path d="M 191.0,143.4 Q 298.7,96.6 256.0,61.0" />
    <path d="M 222.4,130.4 Q 338.5,113.1 306.5,67.6" />
    <path d="M 256.0,126.0 Q 372.7,139.3 353.5,87.1" />
    <path d="M 289.6,130.4 Q 398.9,173.5 393.9,118.1" />
    <path d="M 321.0,143.4 Q 415.4,213.3 424.9,158.5" />
    <path d="M 347.9,164.1 Q 421.0,256.0 444.4,205.5" />
    <path d="M 368.6,191.0 Q 415.4,298.7 451.0,256.0" />
    <path d="M 381.6,222.4 Q 398.9,338.5 444.4,306.5" />
    <circle cx="256" cy="256" r="195" stroke-width="1" />
    <circle cx="256" cy="256" r="130" stroke-width="0.6" stroke-dasharray="3 6" />
    <line x1="56" y1="256" x2="108" y2="256" />
    <line x1="404" y1="256" x2="456" y2="256" />
    <line x1="256" y1="56" x2="256" y2="108" />
    <line x1="256" y1="404" x2="256" y2="456" />
  </g>

  <!-- Perimeter Inscriptions -->
  <text x="256" y="82" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="3" opacity="0.8">
    ARTESANÍA DIGITAL · CRITERIO HUMANO
  </text>
  <text x="256" y="438" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700" letter-spacing="3" opacity="0.8">
    INGENIERÍA RIGUROSA · VALOR REAL
  </text>

  <!-- 3D Monolith Group -->
  <g filter="url(#humShadow)">

    <!-- Protective Seal Hexagon with Curved Fillets -->
    <path d="M 248,109 Q 256,104 264,109 L 382,176 Q 388,180 388,188 L 388,324 Q 388,332 382,336 L 264,403 Q 256,408 248,403 L 130,336 Q 124,332 124,324 L 124,188 Q 124,180 130,176 Z"
          fill="#0c0a09" fill-opacity="0.65"
          stroke="url(#humSheen)" stroke-width="2.8" stroke-linejoin="round" />

    <!-- Corner Gold Rivets / Human Anchor Points -->
    <circle cx="256" cy="106" r="3.5" fill="#ffffff" />
    <circle cx="385" cy="182" r="3.5" fill="#fef3c7" />
    <circle cx="385" cy="330" r="3.5" fill="#fef3c7" />
    <circle cx="256" cy="406" r="3.5" fill="#fef3c7" />
    <circle cx="127" cy="330" r="3.5" fill="#fef3c7" />
    <circle cx="127" cy="182" r="3.5" fill="#fef3c7" />

    <!-- ================= THE "M" SCULPTURE ================= -->
    <!-- Left Ascending Wing -->
    <path d="M 144,198 L 186,172 L 186,326 L 144,302 Z"
          fill="url(#humGoldLeft)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Peak Crest (Gentle Arched Curve) -->
    <path d="M 186,172 Q 206,158 224,148 L 224,198 Q 206,208 186,220 Z"
          fill="url(#humChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- Left Valley (Flowing down into the center) -->
    <path d="M 224,148 Q 240,174 256,198 L 256,246 Q 240,222 224,198 Z"
          fill="url(#humGoldLeft)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Valley (Ascending from center with matching curvature) -->
    <path d="M 256,198 Q 272,174 288,148 L 288,198 Q 272,222 256,246 Z"
          fill="url(#humGoldRight)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Peak Crest (Gentle Arched Curve) -->
    <path d="M 288,148 Q 306,158 326,172 L 326,220 Q 306,208 288,198 Z"
          fill="url(#humChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />

    <!-- Right Ascending Wing -->
    <path d="M 326,172 L 368,198 L 368,302 L 326,326 Z"
          fill="url(#humGoldRight)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Structural Flange Base -->
    <path d="M 186,220 L 224,198 L 224,346 L 186,326 Z"
          fill="url(#humGoldLeft)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Right Structural Flange Base -->
    <path d="M 288,198 L 326,220 L 326,326 L 288,346 Z"
          fill="url(#humGoldRight)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- ================= THE "I" COLUMN OF TRUST ================= -->
    <path d="M 248,132 L 256,124 L 256,364 L 248,358 Z"
          fill="url(#humSpire)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M 256,124 L 264,132 L 264,358 L 256,364 Z"
          fill="url(#humGoldRight)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Crown Diamond Jewel -->
    <polygon points="256,108 268,120 256,132 244,120"
             fill="#ffffff" stroke="url(#humSheen)" stroke-width="1.5" />
    <circle cx="256" cy="120" r="2.4" fill="#f59e0b" />

    <!-- Bottom Plumb Jewel -->
    <polygon points="256,358 266,368 256,378 246,368"
             fill="url(#humGoldLeft)" stroke="#ffffff" stroke-width="1" />

    <!-- Optical Core Warm Spark -->
    <circle cx="256" cy="198" r="4" fill="#ffffff" />
    <line x1="236" y1="198" x2="276" y2="198" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />
    <line x1="256" y1="178" x2="256" y2="218" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.9" />

  </g>

  <!-- Hallmark Wordmark -->
  <text x="256" y="472" text-anchor="middle" fill="#fef3c7" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="12" font-weight="800" letter-spacing="5">
    EKC · MIKEL IRASTORZA · EFA
  </text>
</svg>
