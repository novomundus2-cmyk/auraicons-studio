<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mikel Irastorza · Obra de Arte Numismática &amp; Escultura de Datos · EKC &amp; EFA">
  <defs>

    <!-- Deep Obsidian Velvet Canvas -->
    <radialGradient id="artMedalBg" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#221b14" />
      <stop offset="42%" stop-color="#110d0a" />
      <stop offset="85%" stop-color="#070607" />
      <stop offset="100%" stop-color="#020304" />
    </radialGradient>

    <!-- Warm Golden Ambient Hearth -->
    <radialGradient id="artMedalHalo" cx="50%" cy="50%" r="52%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.45" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.22" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Liquid Mirror Champagne Specular Gradient -->
    <linearGradient id="artLiquidGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="18%" stop-color="#fffbeb" />
      <stop offset="45%" stop-color="#fef08a" />
      <stop offset="75%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Sun-Facing Left Sculptural Flank -->
    <linearGradient id="artFacetLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef9c3" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="75%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <!-- Center Folded Valley (Artistic Patina) -->
    <linearGradient id="artFacetCenter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="40%" stop-color="#78350f" />
      <stop offset="80%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Deep Forged Bronze Flank (Right Wing) -->
    <linearGradient id="artFacetRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Pure Platinum Spire -->
    <linearGradient id="artPlatinumSpire" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffef0" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Specular Bevel Hairline -->
    <linearGradient id="artBevelSheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.95" />
    </linearGradient>

    <!-- High-Relief Shadow -->
    <filter id="highReliefShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.92" />
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.4" />
    </filter>

  </defs>

  <!-- Deep Obsidian Squircle Frame -->
  <rect width="512" height="512" rx="112" fill="url(#artMedalBg)" />
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#artBevelSheen)" stroke-width="2" stroke-opacity="0.45" />
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.18" stroke-dasharray="3 6" />

  <!-- Warm Core Halo -->
  <circle cx="256" cy="256" r="218" fill="url(#artMedalHalo)" />

  <!-- 36-Petal Sacred Geometry Guilloche -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.16" stroke-width="0.8">
    <path d="M 376.0,256.0 Q 394.6,336.0 356.0,429.2" />
    <path d="M 374.2,276.8 Q 378.6,358.8 324.4,443.9" />
    <path d="M 368.8,297.0 Q 358.8,378.6 290.7,453.0" />
