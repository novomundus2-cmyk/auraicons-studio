    <path d="M 276.8,137.8 Q 358.8,133.4 443.9,187.6" />
    <path d="M 297.0,143.2 Q 378.6,153.2 453.0,221.3" />
    <path d="M 316.0,152.1 Q 394.6,176.0 456.0,256.0" />
    <path d="M 333.1,164.1 Q 406.4,201.3 453.0,290.7" />
    <path d="M 347.9,178.9 Q 413.6,228.2 443.9,324.4" />
    <path d="M 359.9,196.0 Q 416.0,256.0 429.2,356.0" />
    <path d="M 368.8,215.0 Q 413.6,283.8 409.2,384.6" />
    <path d="M 374.2,235.2 Q 406.4,310.7 384.6,409.2" />
    <circle cx="256" cy="256" r="198" stroke-width="1.2" stroke-opacity="0.25" />
    <circle cx="256" cy="256" r="192" stroke-width="0.5" stroke-dasharray="2 4" />
    <circle cx="256" cy="256" r="120" stroke-width="0.6" stroke-dasharray="3 6" />
    <line x1="56" y1="256" x2="108" y2="256" stroke-width="1" />
    <line x1="404" y1="256" x2="456" y2="256" stroke-width="1" />
    <line x1="256" y1="56" x2="256" y2="108" stroke-width="1" />
    <line x1="256" y1="404" x2="256" y2="456" stroke-width="1" />
  </g>

  <!-- High-Art Perimeter Inscriptions -->
  <text x="256" y="80" text-anchor="middle" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="4" opacity="0.85">
    ARS ET SCIENTIA · DE DIVINA PROPORTIONE
  </text>
  <text x="256" y="440" text-anchor="middle" fill="#fbbf24" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="9" font-weight="700" letter-spacing="4" opacity="0.85">
    ESCULTURA DE DATOS · CRITERIO HUMANO
  </text>

  <!-- 3D High-Relief Monolith Group -->
  <g filter="url(#highReliefShadow)">

    <!-- Protective Outer Hexagonal Seal with Curved Fillets -->
    <path d="M 248,104 Q 256,98 264,104 L 384,174 Q 392,178 392,188 L 392,324 Q 392,334 384,338 L 264,408 Q 256,414 248,408 L 128,338 Q 120,334 120,324 L 120,188 Q 120,178 128,174 Z"
          fill="#0c0907" fill-opacity="0.75"
          stroke="url(#artBevelSheen)" stroke-width="3.2" stroke-linejoin="round" />

    <!-- Corner Star Rivets / Golden Constellation -->
    <circle cx="256" cy="101" r="3.8" fill="#ffffff" />
    <circle cx="388" cy="181" r="3.8" fill="#fef3c7" />
    <circle cx="388" cy="331" r="3.8" fill="#fef3c7" />
    <circle cx="256" cy="411" r="3.8" fill="#fef3c7" />
    <circle cx="124" cy="331" r="3.8" fill="#fef3c7" />
    <circle cx="124" cy="181" r="3.8" fill="#fef3c7" />

    <!-- ================= THE "M" MONOLITHIC SCULPTURE ================= -->
    <!-- Left Wing Outer Wall -->
    <path d="M 140,194 L 186,168 L 186,328 L 140,302 Z"
          fill="url(#artFacetLeft)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Peak Crest (Liquid Mirror Champagne) -->
    <path d="M 186,168 Q 206,154 226,144 L 226,196 Q 206,206 186,220 Z"
          fill="url(#artLiquidGold)" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.9" />

    <!-- Left Valley (Deep Patina Fold) -->
    <path d="M 226,144 Q 242,172 256,196 L 256,248 Q 242,222 226,196 Z"
          fill="url(#artFacetCenter)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Valley -->
    <path d="M 256,196 Q 270,172 286,144 L 286,196 Q 270,222 256,248 Z"
          fill="url(#artFacetRight)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Peak Crest (Liquid Mirror Champagne) -->
    <path d="M 286,144 Q 306,154 326,168 L 326,220 Q 306,206 286,196 Z"
          fill="url(#artLiquidGold)" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.9" />

    <!-- Right Wing Outer Wall (Forged Cognac Bronze) -->
    <path d="M 326,168 L 372,194 L 372,302 L 326,328 Z"
          fill="url(#artFacetRight)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Base Flange -->
    <path d="M 186,220 L 226,196 L 226,348 L 186,328 Z"
          fill="url(#artFacetLeft)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Right Base Flange -->
    <path d="M 286,196 L 326,220 L 326,328 L 286,348 Z"
          fill="url(#artFacetRight)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- ================= THE "I" RADIANT SPIRE ================= -->
    <path d="M 248,128 L 256,120 L 256,366 L 248,360 Z"
          fill="url(#artPlatinumSpire)" stroke="#ffffff" stroke-width="0.8" />
    <path d="M 256,120 L 264,128 L 264,360 L 256,366 Z"
          fill="url(#artFacetRight)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Crown Brilliant Diamond Jewel -->
    <polygon points="256,104 268,116 256,128 244,116"
             fill="#ffffff" stroke="url(#artBevelSheen)" stroke-width="1.6" />
    <circle cx="256" cy="116" r="2.5" fill="#f59e0b" />

    <!-- Bottom Plumb Jewel of Pacioli Invariant -->
    <polygon points="256,360 267,371 256,382 245,371"
             fill="url(#artFacetLeft)" stroke="#ffffff" stroke-width="1.2" />

    <!-- Optical Core Lens Flare Spark -->
    <circle cx="256" cy="196" r="4.2" fill="#ffffff" />
    <line x1="234" y1="196" x2="278" y2="196" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.95" />
    <line x1="256" y1="174" x2="256" y2="218" stroke="#ffffff" stroke-width="1.4" stroke-opacity="0.95" />

