    <path d="M 215.0,368.8 Q 133.4,358.8 59.0,290.7" />
    <path d="M 196.0,359.9 Q 117.4,336.0 56.0,256.0" />
    <path d="M 178.9,347.9 Q 105.6,310.7 59.0,221.3" />
    <path d="M 164.1,333.1 Q 98.4,283.8 68.1,187.6" />
    <path d="M 152.1,316.0 Q 96.0,256.0 82.8,156.0" />
    <path d="M 143.2,297.0 Q 98.4,228.2 102.8,127.4" />
    <path d="M 137.8,276.8 Q 105.6,201.3 127.4,102.8" />
    <path d="M 136.0,256.0 Q 117.4,176.0 156.0,82.8" />
    <path d="M 137.8,235.2 Q 133.4,153.2 187.6,68.1" />
    <path d="M 143.2,215.0 Q 153.2,133.4 221.3,59.0" />
    <path d="M 152.1,196.0 Q 176.0,117.4 256.0,56.0" />
    <path d="M 164.1,178.9 Q 201.3,105.6 290.7,59.0" />
    <path d="M 178.9,164.1 Q 228.2,98.4 324.4,68.1" />
    <path d="M 196.0,152.1 Q 256.0,96.0 356.0,82.8" />
    <path d="M 215.0,143.2 Q 283.8,98.4 384.6,102.8" />
