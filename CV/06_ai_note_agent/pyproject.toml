[project]
name = "note-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "main", email = "contacto.iosoi.oro@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "faker>=40.44.0",
    "google-antigravity>=0.1.22",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "polars>=2.0.0",
    "pypdf>=6.21.4",
    "scipy>=1.15.3",
    "sympy>=1.14.0",
]

[project.scripts]
note-agent = "note_agent:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
