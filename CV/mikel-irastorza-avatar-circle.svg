<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Mikel Irastorza · Circular LinkedIn / GitHub Avatar">
  <defs>

    <!-- Deep Obsidian Void Gradient -->
    <radialGradient id="cir_luxBg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="45%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#05070c" />
    </radialGradient>

    <!-- Volumetric Core Gold Aura -->
    <radialGradient id="cir_luxAura" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#d97706" stop-opacity="0.14" />
      <stop offset="70%" stop-color="#b45309" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Top Champagne Gold (Specular Light Crest) -->
    <linearGradient id="cir_specularChampagne" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fffbeb" />
      <stop offset="60%" stop-color="#fef3c7" />
      <stop offset="100%" stop-color="#fde68a" />
    </linearGradient>

    <!-- Sun-Facing Left Isometric Plane -->
    <linearGradient id="cir_goldLightPlane" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#f59e0b" />
      <stop offset="85%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Mid Tone Brushed Amber Surface -->
    <linearGradient id="cir_goldMidPlane" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="40%" stop-color="#d97706" />
      <stop offset="80%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>

    <!-- Deep Bronze Shadow Plane (Right Flank) -->
    <linearGradient id="cir_goldDarkPlane" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="20%" stop-color="#d97706" />
      <stop offset="65%" stop-color="#92400e" />
      <stop offset="100%" stop-color="#5a2307" />
    </linearGradient>

    <!-- Platinum Gold for Central Needle -->
    <linearGradient id="cir_spirePlatinum" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#fef3c7" />
      <stop offset="70%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Razor Bevel Wireframe Edge Highlight -->
    <linearGradient id="cir_edgeGleam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9" />
    </linearGradient>

    <!-- Multi-stage Depth Drop Shadow -->
    <filter id="cir_monolithShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.88" />
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#f59e0b" flood-opacity="0.32" />
    </filter>

  </defs>

  <!-- Circular Outer Shield -->
  <circle cx="256" cy="256" r="256" fill="url(#cir_luxBg)" />
  <circle cx="256" cy="256" r="252" fill="none" stroke="url(#cir_edgeGleam)" stroke-width="2.5" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="242" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="3 6" />

  <!-- Core Ambient Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#cir_luxAura)" />

  <!-- Precision CAD Crosshairs and Rings -->
  <g fill="none" stroke="#f59e0b" stroke-opacity="0.2">
    <circle cx="256" cy="256" r="192" stroke-width="1" />
    <circle cx="256" cy="256" r="187" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="56" y1="256" x2="108" y2="256" stroke-width="1" />
    <line x1="404" y1="256" x2="456" y2="256" stroke-width="1" />
    <line x1="256" y1="56" x2="256" y2="108" stroke-width="1" />
    <line x1="256" y1="404" x2="256" y2="456" stroke-width="1" />
    <circle cx="256" cy="64" r="2.5" fill="#fef3c7" />
    <circle cx="422" cy="160" r="2.5" fill="#fef3c7" />
    <circle cx="422" cy="352" r="2.5" fill="#fef3c7" />
    <circle cx="256" cy="448" r="2.5" fill="#fef3c7" />
    <circle cx="90" cy="352" r="2.5" fill="#fef3c7" />
    <circle cx="90" cy="160" r="2.5" fill="#fef3c7" />
  </g>

  <!-- 3D Monolith Group -->
  <g filter="url(#cir_monolithShadow)">

    <!-- OUTER SHIELD HEXAGON -->
    <polygon points="256,104 388,180 388,332 256,408 124,332 124,180"
             fill="#0c0a09" fill-opacity="0.6"
             stroke="url(#cir_edgeGleam)" stroke-width="3" stroke-linejoin="round" />
    
    <!-- Precision Corner Micro-Rivets -->
    <circle cx="256" cy="104" r="3.5" fill="#ffffff" />
    <circle cx="388" cy="180" r="3.5" fill="#fef3c7" />
    <circle cx="388" cy="332" r="3.5" fill="#fef3c7" />
    <circle cx="256" cy="408" r="3.5" fill="#fef3c7" />
    <circle cx="124" cy="332" r="3.5" fill="#fef3c7" />
    <circle cx="124" cy="180" r="3.5" fill="#fef3c7" />

    <!-- ================= THE "M" MONOLITH ================= -->
    <!-- Left Outer Wall -->
    <path d="M 142,196 L 186,170 L 186,326 L 142,300 Z"
          fill="url(#cir_goldLightPlane)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Peak Incline (Specular Champagne Crest) -->
    <path d="M 186,170 L 224,148 L 224,198 L 186,220 Z"
          fill="url(#cir_specularChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Left Valley (Descending slope into center) -->
    <path d="M 224,148 L 256,198 L 256,246 L 224,198 Z"
          fill="url(#cir_goldMidPlane)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Valley (Ascending slope from center) -->
    <path d="M 256,198 L 288,148 L 288,198 L 256,246 Z"
          fill="url(#cir_goldDarkPlane)" stroke="#fef08a" stroke-width="1" stroke-opacity="0.5" />

    <!-- Right Peak Incline (Specular Champagne Crest) -->
    <path d="M 288,148 L 326,170 L 326,220 L 288,198 Z"
          fill="url(#cir_specularChampagne)" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />

    <!-- Right Outer Wall -->
    <path d="M 326,170 L 370,196 L 370,300 L 326,326 Z"
          fill="url(#cir_goldDarkPlane)" stroke="#fffbeb" stroke-width="1.2" stroke-opacity="0.6" />

    <!-- Left Front Flange (Structural base) -->
    <path d="M 186,220 L 224,198 L 224,346 L 186,326 Z"
          fill="url(#cir_goldLightPlane)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- Right Front Flange -->
    <path d="M 288,198 L 326,220 L 326,326 L 288,346 Z"
          fill="url(#cir_goldDarkPlane)" stroke="#fef3c7" stroke-width="1" stroke-opacity="0.4" />

    <!-- ================= THE "I" CENTRAL KEYSTONE SPIRE ================= -->
    <!-- Needle Left Facet -->
    <path d="M 248,132 L 256,124 L 256,364 L 248,358 Z"
          fill="url(#cir_spirePlatinum)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Needle Right Facet -->
    <path d="M 256,124 L 264,132 L 264,358 L 256,364 Z"
          fill="url(#cir_goldMidPlane)" stroke="#ffffff" stroke-width="0.8" />

    <!-- Top Crown Diamond of "I" -->
    <polygon points="256,108 268,120 256,132 244,120"
             fill="#ffffff" stroke="url(#cir_edgeGleam)" stroke-width="1.5" />
    <circle cx="256" cy="120" r="2.2" fill="#f59e0b" />

    <!-- Bottom Anchor Diamond of "I" -->
    <polygon points="256,358 266,368 256,378 246,368"
             fill="url(#cir_goldLightPlane)" stroke="#ffffff" stroke-width="1" />

    <!-- Optical Core Lens Flare -->
    <circle cx="256" cy="198" r="3.5" fill="#ffffff" />
    <line x1="238" y1="198" x2="274" y2="198" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />
    <line x1="256" y1="180" x2="256" y2="216" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.85" />

  </g>

  <!-- Perimeter Top & Bottom Inscription -->
  <text x="256" y="86" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="2.5" opacity="0.75">
    PRECISION CAD ±0.200mm · EPTA ROBOTICS
  </text>
  <text x="256" y="432" text-anchor="middle" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" letter-spacing="2.5" opacity="0.75">
    LUCA PACIOLI LEDGER · 0.00¢ INVARIANT
  </text>
  <text x="256" y="462" text-anchor="middle" fill="#fef3c7" font-family="'Space Grotesk', -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="4">
    EKC · MIKEL IRASTORZA · EFA
  </text>
</svg>
