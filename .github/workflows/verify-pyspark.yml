name: Verify code and PySpark example

on:
  push:
    branches: [main, 'cierre/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
  pyspark:
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: tests/requirements-pyspark.txt
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -r tests/requirements-pyspark.txt
      - run: ruff check public/train_rf_bigquery.py tests/test_pyspark_example.py
      - run: ruff format --check public/train_rf_bigquery.py tests/test_pyspark_example.py
      - run: python -m unittest discover -s tests -p test_pyspark_example.py -v
      - name: Validate notebook
        run: |
          python - <<'PY'
          import ast
          import nbformat
          nb = nbformat.read('public/pyspark_random_forest.ipynb', as_version=4)
          nbformat.validate(nb)
          for cell in nb.cells:
              if cell.cell_type == 'code':
                  assert not cell.outputs and cell.execution_count is None
                  if not cell.source.startswith('%'):
                      ast.parse(cell.source)
          PY
